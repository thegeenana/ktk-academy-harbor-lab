services:
  harbor:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://harbor:harbor@postgres:5432/harbor
      HARBOR_VERSION: 0.2.0
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
  postgres:
    # Patch pin: the floating `16` tag moves when a new 16.x release is published.
    image: postgres:16.15
    ports:
      # Host-side `npm run dev:api` connects here. Set HARBOR_POSTGRES_PORT when 5432 is taken.
      - "${HARBOR_POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: harbor
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: harbor
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbor -d harbor"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres-data:
